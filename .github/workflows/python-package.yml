name: Python package

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python utest/check_built_packages.py dist
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: zencad-distributions
          path: dist/*

  headless-matrix:
    needs: build-distributions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: zencad-distributions
          path: dist
      - name: Install the prebuilt headless wheel
        run: |
          python -m pip install --upgrade pip
          python utest/install_built_wheel.py
          python -m pip check
      - name: Verify the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/utest/installed_wheel_smoke.py"
      - name: Install the headless test extra
        run: python utest/install_built_wheel.py --test
      - name: Run the headless regression suite
        run: python utest/run_headless.py

  sdist-smoke:
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: zencad-distributions
          path: dist
      - name: Install the source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: dist/zencad-*.tar.gz
          python -m pip check
      - name: Verify the installed source distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/utest/installed_wheel_smoke.py"

  examples-linux:
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: zencad-distributions
          path: dist
      - name: Install the examples extra
        run: |
          python -m pip install --upgrade pip
          python utest/install_built_wheel.py --examples
          python -m pip check
      - name: Evaluate every bundled example without a viewer
        run: python utest/examples.py
      - name: Evaluate every bundled example through the managed runner
        run: python utest/examples.py --managed

  gui-linux:
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: zencad-distributions
          path: dist
      - name: Install X11 smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libglu1-mesa \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Install GUI extra
        run: |
          python -m pip install --upgrade pip
          python utest/install_built_wheel.py --gui
          python -m pip check
      - name: Verify the installed GUI wheel outside the checkout
        env:
          QT_QPA_PLATFORM: offscreen
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/utest/installed_gui_wheel_smoke.py"
      - name: Exercise local OCP viewer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a python "${{ github.workspace }}/utest/gui_ocp_smoke.py"
      - name: Exercise persistent managed reload
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a python "${{ github.workspace }}/utest/gui_reload_smoke.py"
      - name: Exercise managed game input
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a python "${{ github.workspace }}/utest/gui_games_smoke.py"
      - name: Exercise same-process standalone viewer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a python -m zencad --display "${{ github.workspace }}/utest/gui_standalone_smoke.py"
      - name: Exercise standalone Ctrl+C handling
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a python "${{ github.workspace }}/utest/gui_standalone_sigint_smoke.py"
      - name: Exercise main-window startup and Ctrl+C handling
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a python "${{ github.workspace }}/utest/gui_mainwindow_sigint_smoke.py"

  gui-windows-macos:
    needs: build-distributions
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: zencad-distributions
          path: dist
      - name: Install GUI extra entirely from wheels
        run: |
          python -m pip install --upgrade pip
          python utest/install_built_wheel.py --gui
          python -m pip check
      - name: Verify GUI and native-window bindings outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/utest/installed_gui_wheel_smoke.py"
