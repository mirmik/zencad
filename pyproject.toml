[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zencad"
version = "1.3.3"
description = "Scriptable CAD system built on OpenCascade"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "mirmik", email = "mirmikns@yandex.ru" },
]
keywords = ["cad", "opencascade", "3d"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cadquery-ocp-novtk>=7.9.3.1.1,<7.10",
  "evalcache>=1.14.0",
  "numpy",
  "svgwrite",
]

[project.optional-dependencies]
gui = [
  "PyOpenGL",
  "PyQt5>=5.15",
  "PyQt5-sip",
  "zenframe",
]
build = ["build>=1.2"]

[project.scripts]
zencad = "zencad.__main__:main"

[project.urls]
Homepage = "https://github.com/mirmik/zencad"
Documentation = "https://mirmik.github.io/zencad"

[tool.setuptools.packages.find]
include = ["zencad*"]
namespaces = true

[tool.setuptools.package-data]
zencad = [
  "*.jpg",
  "*.png",
  "*.svg",
  "examples/**/*",
]
